name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Unit tests
        # Full `bun test` fails on a pre-existing svelte-sonner -> runed
        # resolution error; run the green files until that is fixed.
        run: bun test src/lib/content/seo-snapshot.test.ts src/lib/seo.test.ts

      - name: Build
        run: bun run build

      - name: Check SEO build output
        run: bun run check:seo
